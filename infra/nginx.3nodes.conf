# ============================================================================
# NGINX · PERFIL DE 3 NODOS
# ----------------------------------------------------------------------------
# Reparto least_conn entre las tres réplicas. Si una cae, NGINX la marca como
# no disponible durante fail_timeout y reintenta la petición en otra
# (proxy_next_upstream), sin devolver 502 al cliente.
# ============================================================================

worker_processes auto;

events {
  worker_connections 8192;
}

http {
  upstream securescan {
    least_conn;
    server api-1:3000 max_fails=2 fail_timeout=5s;
    server api-2:3000 max_fails=2 fail_timeout=5s;
    server api-3:3000 max_fails=2 fail_timeout=5s;
    # Reutiliza conexiones hacia los backends: sin esto NGINX abre y cierra
    # una conexión TCP por petición, lo que consume CPU y añade latencia.
    keepalive 128;
  }

  server {
    listen 80;
    server_name _;

    location / {
      proxy_pass http://securescan;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 3;
    }
  }
}
